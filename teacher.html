<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; padding: 20px; max-width: 600px; margin: 0 auto; color: #1e293b; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { margin: 0; font-size: 1.4rem; color: #334155; }
        .logout { color: #ef4444; text-decoration: none; font-weight: 600; font-size: 0.9rem; }

        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 20px; }
        h2 { margin-top: 0; font-size: 1.1rem; color: #0f172a; margin-bottom: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }

        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .status-btn { 
            border: 2px solid #e2e8f0; background: white; padding: 16px; border-radius: 12px; 
            cursor: pointer; font-weight: 600; color: #64748b; transition: 0.2s; text-align: center;
            font-size: 0.9rem;
        }
        .status-btn:hover { background: #f8fafc; }
        .status-btn.active { border-color: #2563eb; background: #eff6ff; color: #2563eb; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.1); }

        /* Sub Box */
        .sub-details { display: none; margin-top: 20px; background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .tiny { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 5px; display: block; }
        select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; font-size: 0.95rem; margin-bottom: 12px; }

        button.save { 
            width: 100%; padding: 16px; background: #2563eb; color: white; border: none; 
            border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; 
            margin-top: 20px; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); transition: 0.2s;
        }
        button.save:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="d-name">Loading...</h1>
        <a href="#" onclick="logout()" class="logout">Log Out</a>
    </div>

    <div class="card">
        <h2>Set Your Status</h2>
        <div class="status-grid">
            <div class="status-btn active" onclick="setStatus('auto')" id="btn-auto">📅 Normal Schedule</div>
            <div class="status-btn" onclick="setStatus('free')" id="btn-free">☕ Free / Cabin</div>
            <div class="status-btn" onclick="setStatus('meeting')" id="btn-meet">💼 In Meeting</div>
            <div class="status-btn" onclick="setStatus('substitution')" id="btn-sub">🔄 Substitution</div>
        </div>

        <div class="sub-details" id="sub-box">
            <div style="background:#fee2e2; color:#b91c1c; padding:10px; font-size:0.8rem; border-radius:8px; margin-bottom:15px; font-weight:500;">
                ⚠️ Only select this if the original teacher is absent.
            </div>
            
            <label class="tiny">Class Type</label>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <button onclick="toggleSubType('theory')" id="t-th" style="flex:1; padding:10px; border:1px solid #ddd; background:#fff; border-radius:8px;">Theory</button>
                <button onclick="toggleSubType('lab')" id="t-lb" style="flex:1; padding:10px; border:1px solid #ddd; background:#fff; border-radius:8px;">Lab</button>
            </div>

            <div id="theory-group">
                <label class="tiny">Department</label>
                <select id="s-dept" onchange="updateDivs()"><option value="CSE">CSE</option><option value="ADS">ADS</option><option value="EEE">EEE</option><option value="EC">EC</option><option value="ME">ME</option><option value="CE">CE</option><option value="CSD">CSD</option><option value="CSBS">CSBS</option><option value="CC">CC</option></select>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <div><label class="tiny">Year</label><select id="s-year"><option value="1">1st Yr</option><option value="2">2nd Yr</option><option value="3">3rd Yr</option><option value="4">4th Yr</option></select></div>
                    <div><label class="tiny">Div</label><select id="s-div"></select></div>
                </div>
            </div>

            <div id="lab-group" style="display:none;">
                <label class="tiny">Lab Name</label>
                <select id="s-lab" onchange="updateLabNum()"><option value="Computer Lab">Computer Lab</option><option value="CAD Lab">CAD Lab</option><option value="Chemistry Lab">Chemistry Lab</option><option value="Physics Lab">Physics Lab</option><option value="Electronics Lab">Electronics Lab</option><option value="Electrical Lab">Electrical Lab</option><option value="Metallurgy Lab">Metallurgy Lab</option></select>
                <div id="lab-num-box"><label class="tiny">Lab Number</label><select id="s-lab-num"></select></div>
            </div>
        </div>

        <button class="save" onclick="saveStatus()">Update My Status</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCJOcm-V3Gt4yL6adrh0EhWSzR1Z-jKh2M", authDomain: "campuscompass-899ca.firebaseapp.com", projectId: "campuscompass-899ca", storageBucket: "campuscompass-899ca.firebasestorage.app", messagingSenderId: "1054182451273", appId: "1:1054182451273:web:3ec53886693197c441b798", measurementId: "G-3SFMCJQZSW" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        const tid = sessionStorage.getItem("teacherId"); const tname = sessionStorage.getItem("teacherName");
        if(!tid) window.location.href="login.html"; else document.getElementById('d-name').innerText = "Hi, " + tname;

        let status = 'auto'; let subType = 'theory';
        const deptDivs = { "CSE":["A","B","C","D"], "ADS":["A","B"], "EEE":["A"], "EC":["A"], "ME":["A"], "CE":["A"], "CSD":["A"], "CSBS":["A"], "CC":["A"] };

        window.setStatus = (s) => {
            status = s;
            document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
            if(s==='auto') document.getElementById('btn-auto').classList.add('active');
            if(s==='free') document.getElementById('btn-free').classList.add('active');
            if(s==='meeting') document.getElementById('btn-meet').classList.add('active');
            if(s==='substitution') document.getElementById('btn-sub').classList.add('active');
            document.getElementById('sub-box').style.display = (s==='substitution') ? 'block':'none';
            if(s==='substitution') { toggleSubType('theory'); updateDivs(); }
        };

        window.toggleSubType = (t) => {
            subType = t;
            document.getElementById('t-th').style.background = t==='theory' ? '#e0f2fe':'#fff';
            document.getElementById('t-lb').style.background = t==='lab' ? '#e0f2fe':'#fff';
            document.getElementById('theory-group').style.display = t==='theory'?'block':'none';
            document.getElementById('lab-group').style.display = t==='lab'?'block':'none';
        };

        window.updateDivs = () => { const d=document.getElementById('s-dept').value; const s=document.getElementById('s-div'); s.innerHTML=""; (deptDivs[d]||["A"]).forEach(x=>s.innerHTML+=`<option value="${x}">${x}</option>`); };
        window.updateLabNum = () => { const l=document.getElementById('s-lab').value; const box=document.getElementById('lab-num-box'); const sel=document.getElementById('s-lab-num'); sel.innerHTML=""; if(l.includes("Computer")){ box.style.display='block'; for(let i=1;i<=12;i++) sel.innerHTML+=`<option value="${i}">${i}</option>`; } else if(l.includes("CAD")){ box.style.display='block'; sel.innerHTML="<option>1</option><option>2</option>"; } else { box.style.display='none'; } };

        window.saveStatus = async () => {
            const data = { override: status };
            if(status === 'substitution') {
                let locStr="", blk="b-cs";
                if(subType === 'theory') {
                    const d=document.getElementById('s-dept').value, y=document.getElementById('s-year').value, v=document.getElementById('s-div').value;
                    locStr = `S${y*2} ${d}-${v}`;
                    if(["CSE","ADS","CSD","CSBS","CC"].includes(d)) blk="b-cs"; else if(["EC","EEE"].includes(d)) blk="b-ec"; else if(d==="ME") blk="b-mech"; else blk="b-civil";
                } else {
                    const l=document.getElementById('s-lab').value, n=document.getElementById('s-lab-num').value;
                    locStr = document.getElementById('lab-num-box').style.display!=='none' ? `${l} ${n}` : l;
                    if(l.includes("Comp")||l.includes("CC")) blk="b-cs"; else if(l.includes("Elec")||l.includes("Elect")) blk="b-ec"; else if(l.includes("CAD")||l.includes("Meta")) blk="b-mech"; else blk="b-civil";
                }
                data.subLoc = locStr; data.subBlk = blk;
            }
            await updateDoc(doc(db, "faculty", tid), data); alert("Status Updated!");
        };
        window.logout = () => { sessionStorage.clear(); window.location.href="login.html"; };
    </script>
</body>
</html>
